<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Sportilo | Find Players, Join Matches & Build Your Squad</title>

    <meta
      name="description"
      content="Sportilo helps you find players, join matches, create games, and build local sports and gaming communities across India."
    />

    <meta name="author" content="Sportilo" />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://sportilo.in/" />

    <!-- Theme -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/images/mixer.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />

    <!-- Open Graph (Facebook / WhatsApp / Discord / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sportilo" />
    <meta property="og:url" content="https://sportilo.in/" />
    <meta
      property="og:title"
      content="Sportilo | Find Players, Join Matches & Build Your Squad"
    />
    <meta
      property="og:description"
      content="Find players, join matches, create games, and build your local sports and gaming community."
    />
    <meta
      property="og:image"
      content="https://sportilo.in/images/og-image.png"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sportilo | Find Players, Join Matches & Build Your Squad"
    />
    <meta
      name="twitter:description"
      content="Find players, join matches, create games, and build your local sports and gaming community."
    />
    <meta
      name="twitter:image"
      content="https://sportilo.in/images/og-image.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
